<title>Filiation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #eef1ef;
    --sidebar-bg: #e6ebe8;
    --surface: #ffffff;
    --surface-alt: #e3e8e5;
    --border: #c7d0cb;
    --text: #1b2421;
    --text-muted: #5c6b65;
    --accent: #a5762c;
    --accent-soft: #f1e2c8;
    --metric: #46459b;
    --metric-soft: #e4e3f5;
    --derived: #a5762c;
    --derived-soft: #f1e2c8;
    --raw: #2c8567;
    --raw-soft: #dcf0e7;
    --ok: #3f8f43;
    --warn: #b8791a;
    --fail: #b83c33;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 6px 20px rgba(20, 30, 25, 0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121615;
      --sidebar-bg: #171c1a;
      --surface: #1a1f1d;
      --surface-alt: #212824;
      --border: #313c36;
      --text: #e7ece9;
      --text-muted: #93a39b;
      --accent: #dcae5c;
      --accent-soft: #3a3020;
      --metric: #9291d9;
      --metric-soft: #26264a;
      --derived: #dcae5c;
      --derived-soft: #3a3020;
      --raw: #55c39c;
      --raw-soft: #16332a;
      --ok: #67c26a;
      --warn: #e0a83f;
      --fail: #e2685f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #121615;
    --sidebar-bg: #171c1a;
    --surface: #1a1f1d;
    --surface-alt: #212824;
    --border: #313c36;
    --text: #e7ece9;
    --text-muted: #93a39b;
    --accent: #dcae5c;
    --accent-soft: #3a3020;
    --metric: #9291d9;
    --metric-soft: #26264a;
    --derived: #dcae5c;
    --derived-soft: #3a3020;
    --raw: #55c39c;
    --raw-soft: #16332a;
    --ok: #67c26a;
    --warn: #e0a83f;
    --fail: #e2685f;

  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ---------- Sidebar ---------- */

  .sidebar {
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    padding: 1.1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;

  .brand { display: flex; align-items: center; gap: 0.6rem; }
  .brand-mark { font-size: 1.5rem; line-height: 1; }
  .brand h1 { font-weight: 700; font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
  .tagline { display: none; margin: 0.25rem 0 0; color: var(--text-muted); font-size: 0.85rem; max-width: 30ch; line-height: 1.5; }

  .dataset-switch { display: flex; gap: 0.4rem; }

  .ds-btn {
    flex: 1;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.4rem 0.3rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
  }

  .ds-btn:hover { color: var(--text); }

  .ds-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  .role-picker { display: flex; flex-direction: column; }

  .role-picker select {
    font-family: "IBM Plex Sans", sans-serif;

    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    width: 100%;
  }

  .role-note {
    margin: 0.4rem 0 0;
    font-size: 0.76rem;
    color: var(--text-muted);
    line-height: 1.5;

  .locked-chip {

    gap: 0.5rem;

    padding: 0.4rem 0.5rem;
    margin: 0 -0.5rem;
    cursor: not-allowed;
  }

  .locked-chip .chip-dot { opacity: 0.4; }
  .locked-chip .lock-mark { font-size: 0.75rem; }

  .token.is-locked {
    cursor: not-allowed;
    opacity: 0.55;
    border-bottom-style: dashed;
  }

  .role-empty {
    font-size: 0.9rem;

    line-height: 1.6;

  .sidebar-search {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.85rem;
    padding: 0.5rem 0.7rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    width: 100%;

  .sidebar-search::placeholder { color: var(--text-muted); }

  .sidebar-groups { display: flex; flex-direction: row; gap: 1.1rem; overflow-x: auto; padding-bottom: 0.15rem; }
  .sidebar-group { display: flex; flex-direction: row; align-items: center; gap: 0.3rem; flex-shrink: 0; }
  .sidebar-group-title { display: none; }
  .sidebar-list { display: flex; flex-direction: row; gap: 0.3rem; list-style: none; margin: 0; padding: 0; }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    width: 100%;
    font: inherit;
    font-size: 0.85rem;
    text-align: left;
    background: none;
    border: none;
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    color: var(--text-muted);

    white-space: nowrap;
  }

  .sidebar-item:hover { background: var(--surface-alt); color: var(--text); }

  .sidebar-item.active {
    background: var(--surface);
    color: var(--text);
    font-weight: 600;

  .sidebar-dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; flex-shrink: 0; }
  .sidebar-dot.type-metric { background: var(--metric); }
  .sidebar-dot.type-derived { background: var(--derived); }
  .sidebar-dot.type-raw { background: var(--raw); }

  /* ---------- Main content ---------- */

  .content { padding: 1.75rem 1.5rem 4rem; max-width: 760px; width: 100%; margin: 0 auto; }

  .view-switch { display: flex; gap: 0.4rem; margin-bottom: 1.25rem; }

  .view-btn {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;

  .view-btn:hover { color: var(--text); }

  .view-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }

  #graphe-view { display: flex; flex-direction: column; gap: 0.9rem; height: calc(100vh - 9rem); }

  .graph-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .impact-toggle {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    cursor: pointer;
  }

  .impact-toggle input { accent-color: var(--accent); }

  .zoom-controls { display: flex; gap: 0.3rem; }

  .zoom-controls button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    min-width: 2.1rem;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    border-radius: 6px;
    cursor: pointer;
  }

  .zoom-controls button:hover { color: var(--text); border-color: var(--accent); }

  .graph-canvas {
    flex: 1;
    min-height: 320px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
    position: relative;
    cursor: grab;
    touch-action: none;
  }

  .graph-canvas.is-panning { cursor: grabbing; }
  .graph-canvas svg { display: block; width: 100%; height: 100%; }

  .graph-node.is-clickable { cursor: pointer; }
  .graph-node.is-dimmed { opacity: 0.28; }
  .graph-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .graph-edge.is-dimmed { opacity: 0.15; }
  .graph-edge.is-impacted { stroke: var(--accent) !important; color: var(--accent) !important; stroke-width: 2px !important; }

  .graph-infobar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    min-height: 1.6rem;
  }

  .graph-infobar strong { color: var(--text); }

  .graph-infobar button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    padding: 0.3rem 0.65rem;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
  }

  .system-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.4rem;
    margin-bottom: 1.5rem;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .system-title { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.4rem; }
  .system-meta { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 0.9rem; }

  .system-tables { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
  .system-tables .chip { background: var(--surface-alt); padding: 0.4rem 0.65rem; margin: 0; }
  .system-tables .chip:hover { background: var(--surface); border: 1px solid var(--accent); }

  .derive-toolbar {
    display: flex;
    align-items: flex-end;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }

  .derive-toolbar label {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
  }

  .derive-toolbar select {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 0.85rem;
    text-transform: none;
    letter-spacing: normal;
    padding: 0.5rem 0.6rem;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    min-width: 220px;
  }

  .derive-arrow { color: var(--text-muted); padding-bottom: 0.5rem; }

  .derive-note {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 0.25rem 0.55rem;
    margin-bottom: 1rem;
  }

  .derive-summary { font-size: 0.9rem; color: var(--text-muted); margin: 0 0 1.5rem; }
  .derive-summary strong { color: var(--text); }

  .derive-section { margin-bottom: 1.75rem; }
  .derive-section:last-child { margin-bottom: 0; }

  .derive-empty { font-size: 0.85rem; color: var(--text-muted); font-style: italic; }

  .derive-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }

  .derive-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.87rem;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    background: var(--surface-alt);
  }

  .derive-mark { font-family: "IBM Plex Mono", monospace; font-weight: 700; flex-shrink: 0; }
  .derive-mark.add { color: var(--ok); }
  .derive-mark.remove { color: var(--fail); }
  .derive-mark.change { color: var(--warn); }

  .derive-row code { font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; }

  .breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.3rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.76rem;
    color: var(--text-muted);
    overflow-x: auto;
    margin-bottom: 1.5rem;
  }

  .crumb {
    background: none;
    border: none;
    padding: 0.1rem 0.25rem;
    font: inherit;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    white-space: nowrap;
  }

  .crumb:hover { color: var(--accent); }
  .crumb.current { color: var(--text); font-weight: 600; cursor: default; }
  .crumb.current:hover { color: var(--text); }
  .crumb-sep { color: var(--border); }

  select:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .inspector-content { display: flex; flex-direction: column; gap: 1.5rem; animation: fadeIn 200ms ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .inspector-content { animation: none; }
  }

  .node-head { display: flex; flex-direction: column; gap: 0.6rem; }
  .badge-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }

  .badge {
    display: inline-flex;
    align-items: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 0.26rem 0.55rem;
    border-radius: 999px;
  }

  .badge.type-metric { background: var(--metric-soft); color: var(--metric); }
  .badge.type-derived { background: var(--derived-soft); color: var(--derived); }
  .badge.type-raw { background: var(--raw-soft); color: var(--raw); }
  .badge.domain { background: none; color: var(--text-muted); border: 1px solid var(--border); }

  .tag-pill {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    letter-spacing: 0.02em;
    padding: 0.22rem 0.5rem;
    border-radius: 6px;
    border: 1px dashed var(--border);
    color: var(--text-muted);
  }

  .node-name { font-size: 1.6rem; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  .node-desc { margin: 0; color: var(--text-muted); max-width: 62ch; line-height: 1.6; font-size: 0.95rem; }

  .lineage-figure { margin: 0; }
  .lineage-figure svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .lineage-figure figcaption { text-align: center; font-size: 0.78rem; color: var(--text-muted); margin-top: 0.4rem; }
  .lineage-node.is-clickable { cursor: pointer; }
  .lineage-node.is-clickable:hover .lineage-rect { stroke-width: 2.2px; }
  .lineage-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .keyfacts {
    margin: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .ext-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    background: none;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 0.32rem 0.65rem;
    cursor: not-allowed;
    width: fit-content;
  }

  .query-hint-wrap { display: flex; flex-direction: column; gap: 0.35rem; }

  .query-hint {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.5rem 0.5rem 0.75rem;
    overflow-x: auto;
  }

  .query-hint code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.82rem;
    white-space: pre;
    flex: 1;
  }

  .query-hint-copy {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    padding: 0.3rem 0.6rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .query-hint-copy:hover { border-color: var(--accent); color: var(--accent); }

  .query-hint-note { margin: 0; font-size: 0.76rem; color: var(--text-muted); }

  .query-hint-wrap.danger .query-hint { border-color: var(--fail); }
  .query-hint-wrap.danger .query-hint code { color: var(--fail); }
  .query-hint-wrap.danger .query-hint-note { color: var(--fail); }

  .issue-link-wrap { display: flex; flex-direction: column; gap: 0.3rem; }

  .issue-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    width: fit-content;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 0.4rem 0.75rem;
    text-decoration: none;
  }

  .issue-link:hover { text-decoration: underline; }

  .quality-row { display: flex; flex-wrap: wrap; gap: 0.45rem; }

  .quality-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--text-muted);
    background: var(--surface-alt);
    padding: 0.28rem 0.6rem;
    border-radius: 999px;
  }

  .quality-dot { width: 0.4rem; height: 0.4rem; border-radius: 50%; flex-shrink: 0; }
  .quality-dot.status-ok { background: var(--ok); }
  .quality-dot.status-warn { background: var(--warn); }
  .quality-dot.status-fail { background: var(--fail); }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 0 0 0.55rem;
  }

  .formula-bar, .sql-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    overflow-x: auto;
    box-shadow: var(--shadow);
  }

  .formula-text {
    font-family: "IBM Plex Mono", monospace;
    font-size: 1.05rem;
    white-space: pre;
    display: flex;
    align-items: center;
    gap: 0.15rem;
    width: max-content;
  }

  .sql-block pre {
    margin: 0;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.82rem;
    line-height: 1.65;
    white-space: pre;
    width: max-content;
    min-width: 100%;
  }

  .token {
    font: inherit;
    border: none;
    background: none;
    cursor: pointer;
    padding: 0.1rem 0.3rem;
    border-radius: 5px;
    border-bottom: 2px solid currentColor;
  }

  .token.type-metric { color: var(--metric); }
  .token.type-derived { color: var(--derived); }
  .token.type-raw { color: var(--raw); }
  .token:hover { background: var(--surface-alt); }

  details.tech-details { border-top: 1px solid var(--border); }

  details.tech-details summary {
    cursor: pointer;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-muted);
    padding: 0.85rem 0;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 0.45rem;
  }

  details.tech-details summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; display: inline-block; transition: transform 150ms ease; }
  details[open] summary::before { transform: rotate(90deg); }

  @media (prefers-reduced-motion: reduce) {
    summary::before { transition: none; }
  }

  .tech-body { padding: 0 0 0.5rem; display: flex; flex-direction: column; gap: 1.25rem; }

  .example-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .example-pill {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.26rem 0.55rem;
  }

  .col-list { display: flex; flex-direction: column; }

  .col-row { padding: 0.55rem 0; border-bottom: 1px solid var(--border); }
  .col-row:last-child { border-bottom: none; }

  .col-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .col-name { font-family: "IBM Plex Mono", monospace; font-size: 0.87rem; font-weight: 600; }
  .col-type { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--text-muted); }

  .col-tests { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }

  .col-upstream { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-top: 0.4rem; }

  .col-upstream-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .col-upstream-chip {

  function navigate(id, { fromCrumb = false } = {}) {
    if (!fromCrumb && !canSeeNode(id)) return;
    if (fromCrumb) {
      const idx = history.indexOf(id);
      history = history.slice(0, idx + 1);
    } else if (history[history.length - 1] !== id) {
      history.push(id);
    }
    render();
  }

    const nav = document.getElementById("breadcrumb");

      btn.textContent = nodes[id].short;

    });
  }

  function formulaFragment(formula) {
    const wrap = document.createElement("div");
    wrap.className = "formula-text";
    const parts = formula.split(/(\{\w+\})/g);
    for (const part of parts) {
      const match = part.match(/^\{(\w+)\}$/);
      if (match) {
        const dep = nodes[match[1]];
        const btn = document.createElement("button");
        const visible = canSeeNode(match[1]);
        btn.className = "token type-" + dep.type + (visible ? "" : " is-locked");
        btn.textContent = dep.short;
        btn.title = visible ? dep.name : "Accès restreint pour le rôle " + ROLES[currentRole].label;
        if (visible) btn.addEventListener("click", () => navigate(match[1]));
        wrap.appendChild(btn);
      } else if (part.length) {
        wrap.appendChild(document.createTextNode(part));
      }
    }
    return wrap;
  }

  function sqlFragment(sqlText, selfId) {
    const pre = document.createElement("pre");
    const tokens = Object.keys(tokenToNode)
      .filter((t) => tokenToNode[t] !== selfId)
      .sort((a, b) => b.length - a.length)
      .map(escapeRegex);
    if (!tokens.length) { pre.textContent = sqlText; return pre; }
    const re = new RegExp("\\b(" + tokens.join("|") + ")\\b", "g");
    const parts = sqlText.split(re);
    for (const part of parts) {
      if (part === undefined || part === "") continue;
      const depId = tokenToNode[part];
      if (depId) {
        const btn = document.createElement("button");
        btn.className = "token type-" + nodes[depId].type;
        btn.textContent = part;
        btn.title = nodes[depId].name;
        btn.addEventListener("click", () => navigate(depId));
        pre.appendChild(btn);
      } else {
        pre.appendChild(document.createTextNode(part));
      }
    }
    return pre;
  }

  // SQL réel dbt (jinja) : rend cliquables les appels ref()/source() vers d'autres nœuds.
  function realSqlFragment(sqlText, selfId) {
    const re = /\{\{\s*ref\(\s*['"](\w+)['"]\s*\)\s*\}\}|\{\{\s*source\(\s*['"](\w+)['"]\s*,\s*['"](\w+)['"]\s*\)\s*\}\}/g;
    const pre = document.createElement("pre");
    let last = 0, match;
    while ((match = re.exec(sqlText))) {
      if (match.index > last) pre.appendChild(document.createTextNode(sqlText.slice(last, match.index)));
      const depId = match[1] ? match[1] : "src_" + match[3];
      const text = match[0];
      if (depId !== selfId && nodes[depId]) {
        const btn = document.createElement("button");
        btn.className = "token type-" + nodes[depId].type;
        btn.textContent = text;
        btn.title = nodes[depId].name;
        btn.addEventListener("click", () => navigate(depId));
        pre.appendChild(btn);
      } else {
        pre.appendChild(document.createTextNode(text));
      }
      last = re.lastIndex;
    }
    pre.appendChild(document.createTextNode(sqlText.slice(last)));
    return pre;
  }

    btn.addEventListener("click", () => {

  function chipList(ids, emptyText) {

  function section(title, contentEl) {

  // ---------- Mini-diagramme de position dans le lignage ----------

  const SVG_NS = "http://www.w3.org/2000/svg";

  function estimateBoxWidth(label) {
    return Math.max(72, Math.min(200, label.length * 6.6 + 22));
  }

  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function lineageDiagram(id) {
    const node = nodes[id];
    const deps = node.deps || [];
    const parents = usedBy(id);
    if (!deps.length && !parents.length) return null;

    const gapX = 14, gapY = 46, boxH = 32;

    function layoutRow(ids) {
      const widths = ids.map((i) => estimateBoxWidth(nodes[i].short));
      const totalW = widths.reduce((a, b) => a + b, 0) + gapX * Math.max(0, ids.length - 1);
      return { ids, widths, totalW };
    }

    const depsRow = layoutRow(deps);
    const parentsRow = layoutRow(parents);
    const centerW = estimateBoxWidth(node.short) + 22;
    const centerH = boxH + 10;

    const svgW = Math.max(depsRow.totalW, centerW, parentsRow.totalW, 180) + 40;

    let y = 16;
    const depsY = y;
    if (deps.length) y += boxH + gapY;
    const centerY = y;
    y += centerH + (parents.length ? gapY : 16);
    const parentsY = y;
    if (parents.length) y += boxH + 16;
    const svgH = y;

    function placeRow(row, rowY, h) {
      let x = svgW / 2 - row.totalW / 2;
      return row.ids.map((rowId, idx) => {
        const w = row.widths[idx];
        const pos = { id: rowId, x, y: rowY, w, h };
        x += w + gapX;
        return pos;
      });
    }

    const depsPositions = deps.length ? placeRow(depsRow, depsY, boxH) : [];
    const centerPos = { id, x: svgW / 2 - centerW / 2, y: centerY, w: centerW, h: centerH };
    const parentsPositions = parents.length ? placeRow(parentsRow, parentsY, boxH) : [];

    const svg = svgEl("svg", {
      viewBox: `0 0 ${svgW} ${svgH}`,
      role: "img",
      "aria-label": `Position de ${node.short} dans le lignage : ${deps.length ? deps.length + " dépendance(s) en amont" : "aucune dépendance"}, ${parents.length ? parents.length + " référence(s) en aval" : "aucune référence"}.`,
    });

    const defs = svgEl("defs", {});
    const marker = svgEl("marker", {
      id: "lineage-arrow", viewBox: "0 0 10 10", refX: "8", refY: "5",
      markerWidth: "6.5", markerHeight: "6.5", orient: "auto-start-reverse",
    });
    marker.appendChild(svgEl("path", { d: "M0,0 L10,5 L0,10 z", style: "fill: currentColor" }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    function drawArrow(x1, y1, x2, y2) {
      svg.appendChild(svgEl("line", {
        x1, y1, x2, y2,
        style: "stroke: var(--text-muted); color: var(--text-muted); stroke-width: 1.3px;",
        "marker-end": "url(#lineage-arrow)",
      }));
    }

    function drawBox(pos, isCenter, clickable) {
      const type = nodes[pos.id].type;
      const visible = canSeeNode(pos.id);
      clickable = clickable && visible;
      const g = svgEl("g", { class: "lineage-node" + (clickable ? " is-clickable" : "") });
      const rect = svgEl("rect", {
        x: pos.x, y: pos.y, width: pos.w, height: pos.h, rx: 7, class: "lineage-rect",
        style: `fill: var(--${type}-soft); stroke: var(--${type}); stroke-width: ${isCenter ? 2 : 1.2}px; opacity: ${visible ? 1 : 0.45};`,
      });
      const text = svgEl("text", {
        x: pos.x + pos.w / 2, y: pos.y + pos.h / 2 + 4, "text-anchor": "middle",
        style: `font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: var(--${type}); font-weight: ${isCenter ? 700 : 500}; opacity: ${visible ? 1 : 0.45};`,
      });
      text.textContent = nodes[pos.id].short;
      g.append(rect, text);
      if (!visible) g.setAttribute("aria-label", "Accès restreint pour le rôle " + ROLES[currentRole].label);
      if (clickable) {
        g.setAttribute("tabindex", "0");
        g.setAttribute("role", "button");
        g.setAttribute("aria-label", "Aller à " + nodes[pos.id].name);
        const go = () => navigate(pos.id);
        g.addEventListener("click", go);
        g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      }
      svg.appendChild(g);
    }

    for (const pos of depsPositions) {
      drawArrow(pos.x + pos.w / 2, pos.y + pos.h, centerPos.x + centerPos.w / 2, centerPos.y);
    }
    for (const pos of parentsPositions) {
      drawArrow(centerPos.x + centerPos.w / 2, centerPos.y + centerPos.h, pos.x + pos.w / 2, pos.y);
    }
    for (const pos of depsPositions) drawBox(pos, false, true);
    drawBox(centerPos, true, false);
    for (const pos of parentsPositions) drawBox(pos, false, true);

    const figure = document.createElement("figure");
    figure.className = "lineage-figure";
    figure.appendChild(svg);
    const caption = document.createElement("figcaption");
    caption.textContent = deps.length && parents.length
      ? "En haut : ce dont ce nœud dépend. En bas : ce qui le référence."
      : deps.length
        ? "Ce dont ce nœud dépend."
        : "Ce qui référence ce nœud.";
    figure.appendChild(caption);
    return figure;
  }

  // ---------- Vue graphe complet (DAG zoomable + analyse d'impact) ----------

  let currentView = "fiche";
  let graphFocusId = null;
  let impactMode = false;
  let zoomScale = 1, panX = 0, panY = 0;

  function switchView(view) {
    if (currentView === view) return;
    currentView = view;
    document.querySelectorAll(".view-btn").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
    document.getElementById("fiche-view").hidden = view !== "fiche";
    document.getElementById("graphe-view").hidden = view !== "graphe";
    document.getElementById("derive-view").hidden = view !== "derive";
    document.getElementById("systemes-view").hidden = view !== "systemes";
    if (view === "graphe") { graphFocusId = null; renderGraphView(); }
    if (view === "derive") populateDeriveSelects();
    if (view === "systemes") renderSystemsView();
  }

  // Niveau = plus long chemin depuis une source (sans dépendance) — place les
  // sources à gauche et les nœuds dérivés à droite, colonne par colonne.
  function computeLayers(ds) {
    const layer = {};
    function layerOf(id, seen) {
      if (layer[id] !== undefined) return layer[id];
      if (seen.has(id)) return 0;
      seen.add(id);
      const deps = ds[id].deps || [];
      const l = deps.length ? 1 + Math.max(...deps.map((d) => (ds[d] ? layerOf(d, seen) : 0))) : 0;
      layer[id] = l;
      return l;
    }
    for (const id in ds) layerOf(id, new Set());
    return layer;
  }

  // Heuristique barycentrique (2 passes) pour limiter les croisements d'arêtes.
  function orderColumns(columns, ds) {
    for (let pass = 0; pass < 2; pass++) {
      for (let c = 1; c < columns.length; c++) {
        const prevIndex = {};
        columns[c - 1].forEach((id, i) => { prevIndex[id] = i; });
        columns[c] = columns[c].slice().sort((a, b) => {
          const da = (ds[a].deps || []).map((d) => prevIndex[d]).filter((v) => v !== undefined);
          const db = (ds[b].deps || []).map((d) => prevIndex[d]).filter((v) => v !== undefined);
          const ma = da.length ? da.reduce((x, y) => x + y, 0) / da.length : 0;
          const mb = db.length ? db.reduce((x, y) => x + y, 0) / db.length : 0;
          return ma - mb;
        });
      }
    }
  }

  function downstreamClosure(id) {
    const seen = new Set();
    const queue = [id];
    while (queue.length) {
      const cur = queue.shift();
      for (const child of usedBy(cur)) {
        if (!seen.has(child)) { seen.add(child); queue.push(child); }
      }
    }
    return seen;
  }

  function applyGraphTransform() {
    const vp = document.getElementById("graph-viewport");
    if (vp) vp.setAttribute("transform", `translate(${panX},${panY}) scale(${zoomScale})`);
    const resetBtn = document.getElementById("zoom-reset");
    if (resetBtn) resetBtn.textContent = Math.round(zoomScale * 100) + "%";
  }

  function renderGraphView() {
    const canvas = document.getElementById("graph-canvas");
    canvas.innerHTML = "";

    const layer = computeLayers(nodes);
    const maxLayer = Math.max(0, ...Object.values(layer));
    const columns = Array.from({ length: maxLayer + 1 }, () => []);
    for (const id in nodes) columns[layer[id]].push(id);
    orderColumns(columns, nodes);

    const boxH = 34, rowGap = 16, colGap = 70, margin = 24;
    const colWidths = columns.map((col) => (col.length ? Math.max(...col.map((id) => estimateBoxWidth(nodes[id].short))) : 80));
    const colX = [];
    { let x = margin; for (let c = 0; c < columns.length; c++) { colX.push(x); x += colWidths[c] + colGap; } }
    const colHeights = columns.map((col) => col.length * (boxH + rowGap) - rowGap);
    const maxColHeight = Math.max(0, ...colHeights);
    const svgW = colX[colX.length - 1] + colWidths[colWidths.length - 1] + margin;
    const svgH = maxColHeight + margin * 2;

    const positions = {};
    columns.forEach((col, c) => {
      const startY = margin + (maxColHeight - colHeights[c]) / 2;
      col.forEach((id, r) => {
        positions[id] = { x: colX[c], y: startY + r * (boxH + rowGap), w: colWidths[c], h: boxH };
      });
    });

    const svg = svgEl("svg", {
      viewBox: `0 0 ${svgW} ${svgH}`, role: "img",
      "aria-label": "Vue d'ensemble du lignage : " + Object.keys(nodes).length + " éléments.",
    });
    const defs = svgEl("defs", {});
    const marker = svgEl("marker", {
      id: "graph-arrow", viewBox: "0 0 10 10", refX: "8", refY: "5",
      markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse",
    });
    marker.appendChild(svgEl("path", { d: "M0,0 L10,5 L0,10 z", style: "fill: currentColor" }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    const viewport = svgEl("g", { id: "graph-viewport" });
    svg.appendChild(viewport);

    for (const id in nodes) {
      for (const dep of nodes[id].deps || []) {
        const a = positions[dep], b = positions[id];
        if (!a || !b) continue;
        const line = svgEl("line", {
          x1: a.x + a.w, y1: a.y + a.h / 2, x2: b.x, y2: b.y + b.h / 2,
          class: "graph-edge",
          style: "stroke: var(--text-muted); color: var(--text-muted); stroke-width: 1.2px;",
          "marker-end": "url(#graph-arrow)",
        });
        line.dataset.from = dep;
        line.dataset.to = id;
        viewport.appendChild(line);
      }
    }

    for (const id in positions) {
      const pos = positions[id];
      const type = nodes[id].type;
      const g = svgEl("g", { class: "graph-node is-clickable", tabindex: "0", role: "button", "aria-label": nodes[id].name });
      g.dataset.id = id;
      const rect = svgEl("rect", {
        x: pos.x, y: pos.y, width: pos.w, height: pos.h, rx: 7, class: "lineage-rect",
        style: `fill: var(--${type}-soft); stroke: var(--${type}); stroke-width: 1.2px;`,
      });
      const text = svgEl("text", {
        x: pos.x + pos.w / 2, y: pos.y + pos.h / 2 + 4, "text-anchor": "middle",
        style: `font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: var(--${type});`,
      });
      text.textContent = nodes[id].short;
      g.append(rect, text);
      const go = () => {
        graphFocusId = graphFocusId === id && !impactMode ? null : id;
        updateGraphHighlight();
      };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      viewport.appendChild(g);
    }

    canvas.appendChild(svg);
    zoomScale = 1; panX = 0; panY = 0;
    applyGraphTransform();
    updateGraphHighlight();
  }

  function strongEl(text) {
    const s = document.createElement("strong");
    s.textContent = text;
    return s;
  }

  function updateGraphHighlight() {
    const canvas = document.getElementById("graph-canvas");
    if (!canvas) return;
    const impactedSet = impactMode && graphFocusId ? downstreamClosure(graphFocusId) : null;

    canvas.querySelectorAll(".graph-node").forEach((g) => {
      const id = g.dataset.id;
      const isFocus = id === graphFocusId;
      const dim = impactedSet ? !(isFocus || impactedSet.has(id)) : false;
      g.classList.toggle("is-dimmed", dim);
      const rect = g.querySelector(".lineage-rect");
      if (rect) rect.style.strokeWidth = isFocus ? "2.6px" : "1.2px";
    });

    canvas.querySelectorAll(".graph-edge").forEach((line) => {
      const from = line.dataset.from, to = line.dataset.to;
      let dim = false, imp = false;
      if (impactedSet) {
        const bothIn = (from === graphFocusId || impactedSet.has(from)) && (to === graphFocusId || impactedSet.has(to));
        dim = !bothIn;
        imp = bothIn;
      }
      line.classList.toggle("is-dimmed", dim);
      line.classList.toggle("is-impacted", imp);
    });

    const infobar = document.getElementById("graph-infobar");
    infobar.innerHTML = "";
    if (!graphFocusId) {
      infobar.textContent = impactMode
        ? "Cliquez un nœud pour voir tout ce qui en dépend en aval."
        : "Cliquez un nœud pour le sélectionner.";
      return;
    }
    const node = nodes[graphFocusId];
    const label = document.createElement("span");
    if (impactedSet) {
      label.append(document.createTextNode("Impact de "), strongEl(node.name), document.createTextNode(" : " + impactedSet.size + " élément(s) en aval."));
    } else {
      label.append(document.createTextNode("Sélection : "), strongEl(node.name));
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Voir la fiche →";
    btn.addEventListener("click", () => { switchView("fiche"); history = [graphFocusId]; render(); });
    infobar.append(label, btn);
  }

  document.querySelectorAll(".view-btn").forEach((btn) => {
    btn.addEventListener("click", () => switchView(btn.dataset.view));
  });

  document.getElementById("impact-mode").addEventListener("change", (e) => {
    impactMode = e.target.checked;
    updateGraphHighlight();
  });

  const graphCanvas = document.getElementById("graph-canvas");

  graphCanvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    zoomScale = Math.min(2.5, Math.max(0.35, zoomScale * factor));
    applyGraphTransform();
  }, { passive: false });

  let isPanning = false, panStart = null;
  graphCanvas.addEventListener("mousedown", (e) => {
    if (e.target.closest(".graph-node")) return;
    isPanning = true;
    panStart = { x: e.clientX - panX, y: e.clientY - panY };
    graphCanvas.classList.add("is-panning");
  });
  window.addEventListener("mousemove", (e) => {
    if (!isPanning) return;
    panX = e.clientX - panStart.x;
    panY = e.clientY - panStart.y;
    applyGraphTransform();
  });
  window.addEventListener("mouseup", () => { isPanning = false; graphCanvas.classList.remove("is-panning"); });

  document.getElementById("zoom-in").addEventListener("click", () => { zoomScale = Math.min(2.5, zoomScale * 1.2); applyGraphTransform(); });
  document.getElementById("zoom-out").addEventListener("click", () => { zoomScale = Math.max(0.35, zoomScale / 1.2); applyGraphTransform(); });
  document.getElementById("zoom-reset").addEventListener("click", () => { zoomScale = 1; panX = 0; panY = 0; applyGraphTransform(); });

  // ---------- Vue Dérive (diff entre deux instantanés du projet réel) ----------

  function populateDeriveSelects() {
    const fromSel = document.getElementById("derive-from");
    const toSel = document.getElementById("derive-to");
    const report = document.getElementById("derive-report");
    const keys = Object.keys(SNAPSHOTS).sort((a, b) => SNAPSHOTS[a].generated_at.localeCompare(SNAPSHOTS[b].generated_at));

    if (keys.length < 2) {
      fromSel.innerHTML = ""; toSel.innerHTML = "";
      report.innerHTML = "";
      const p = document.createElement("p");
      p.className = "derive-empty";
      p.textContent = "Il faut au moins deux instantanés pour comparer. Relance scripts/extract_filiation.py après un futur dbt run pour en accumuler.";
      report.appendChild(p);
      return;
    }

    for (const sel of [fromSel, toSel]) {
      sel.innerHTML = "";
      for (const key of keys) {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = SNAPSHOTS[key].label + " (" + SNAPSHOTS[key].generated_at.slice(0, 10) + ")";
        sel.appendChild(opt);
      }
    }
    fromSel.value = keys[0];
    toSel.value = keys[keys.length - 1];
    renderDeriveReport();
  }

  function diffNodeSets(prev, curr) {
    const addedModels = Object.keys(curr).filter((id) => !prev[id]);
    const removedModels = Object.keys(prev).filter((id) => !curr[id]);
    const columnChanges = [];
    const testChanges = [];

    for (const id in curr) {
      if (!prev[id]) continue;
      const pcols = {}; (prev[id].columns || []).forEach((c) => { pcols[c.name] = c; });
      const ccols = {}; (curr[id].columns || []).forEach((c) => { ccols[c.name] = c; });
      const addedCols = Object.keys(ccols).filter((n) => !pcols[n]);
      const removedCols = Object.keys(pcols).filter((n) => !ccols[n]);
      const typeChanges = Object.keys(ccols)
        .filter((n) => pcols[n] && pcols[n].type !== ccols[n].type)
        .map((n) => ({ column: n, from: pcols[n].type, to: ccols[n].type }));
      if (addedCols.length || removedCols.length || typeChanges.length) {
        columnChanges.push({ id, addedCols, removedCols, typeChanges });
      }
      for (const cname in ccols) {
        if (!pcols[cname]) continue;
        const pt = new Set((pcols[cname].tests || []).map((t) => t.label));
        const ct = new Set((ccols[cname].tests || []).map((t) => t.label));
        const added = [...ct].filter((l) => !pt.has(l));
        const removed = [...pt].filter((l) => !ct.has(l));
        if (added.length || removed.length) testChanges.push({ id, column: cname, added, removed });
      }
    }
    return { addedModels, removedModels, columnChanges, testChanges };
  }

  function deriveRow(mark, markClass, html) {
    const li = document.createElement("li");
    li.className = "derive-row";
    const m = document.createElement("span");
    m.className = "derive-mark " + markClass;
    m.textContent = mark;
    li.append(m, html);
    return li;
  }

  function deriveSection(title, rows) {
    const wrap = document.createElement("div");
    wrap.className = "derive-section";
    const eyebrow = document.createElement("p");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = title;
    wrap.appendChild(eyebrow);
    if (!rows.length) {
      const p = document.createElement("p");
      p.className = "derive-empty";
      p.textContent = "Aucun changement.";
      wrap.appendChild(p);
    } else {
      const ul = document.createElement("ul");
      ul.className = "derive-list";
      rows.forEach((r) => ul.appendChild(r));
      wrap.appendChild(ul);
    }
    return wrap;
  }

  function renderDeriveReport() {
    const fromKey = document.getElementById("derive-from").value;
    const toKey = document.getElementById("derive-to").value;
    const report = document.getElementById("derive-report");
    report.innerHTML = "";
    if (!fromKey || !toKey) return;

    const from = SNAPSHOTS[fromKey], to = SNAPSHOTS[toKey];
    const diff = diffNodeSets(from.nodes, to.nodes);
    const totalChanges = diff.addedModels.length + diff.removedModels.length + diff.columnChanges.length + diff.testChanges.length;

    if (from.label.toLowerCase().includes("exemple") || to.label.toLowerCase().includes("exemple")) {
      const note = document.createElement("span");
      note.className = "derive-note";
      note.textContent = "Exemple illustratif — en usage réel, ces deux instantanés viennent de deux extractions successives.";
      report.appendChild(note);
    }

    const summary = document.createElement("p");
    summary.className = "derive-summary";
    summary.innerHTML = "";
    summary.append(document.createTextNode("De "), strongEl(from.label), document.createTextNode(" à "), strongEl(to.label), document.createTextNode(" — " + totalChanges + " changement(s) détecté(s)."));
    report.appendChild(summary);

    const modelRows = [
      ...diff.addedModels.map((id) => deriveRow("+", "add", codeText(id + " ajouté"))),
      ...diff.removedModels.map((id) => deriveRow("−", "remove", codeText(id + " supprimé"))),
    ];
    report.appendChild(deriveSection("Modèles / sources", modelRows));

    const colRows = [];
    diff.columnChanges.forEach((c) => {
      c.addedCols.forEach((col) => colRows.push(deriveRow("+", "add", codeText(c.id + "." + col + " ajoutée"))));
      c.removedCols.forEach((col) => colRows.push(deriveRow("−", "remove", codeText(c.id + "." + col + " supprimée"))));
      c.typeChanges.forEach((t) => colRows.push(deriveRow("~", "change", codeText(c.id + "." + t.column + " : " + t.from + " → " + t.to))));
    });
    report.appendChild(deriveSection("Colonnes", colRows));

    const testRows = [];
    diff.testChanges.forEach((t) => {
      t.added.forEach((label) => testRows.push(deriveRow("+", "add", codeText(t.id + "." + t.column + " — " + label))));
      t.removed.forEach((label) => testRows.push(deriveRow("−", "remove", codeText(t.id + "." + t.column + " — " + label))));
    });
    report.appendChild(deriveSection("Tests dbt", testRows));
  }

  function codeText(str) {
    const code = document.createElement("code");
    code.textContent = str;
    return code;
  }

  document.getElementById("derive-from").addEventListener("change", renderDeriveReport);
  document.getElementById("derive-to").addEventListener("change", renderDeriveReport);

  // ---------- Vue Systèmes source ----------

  function groupBySystem() {
    const groups = {};
    for (const id in nodes) {
      const n = nodes[id];
      if (n.type === "raw" && n.source) {
        groups[n.source.system] = groups[n.source.system] || [];
        groups[n.source.system].push(id);
      }
    }
    return groups;
  }

  function systemImpactCount(ids) {
    const all = new Set();
    ids.forEach((id) => downstreamClosure(id).forEach((d) => all.add(d)));
    ids.forEach((id) => all.delete(id));
    return all.size;
  }

  // Mini schéma relationnel : relations inférées par convention de nommage
  // (fkGuesses, calculées côté script — aucune contrainte réelle en base pour
  // ce projet, vérifié via information_schema).
  function erDiagram(ids) {
    const gapX = 90, boxH = 34, margin = 20, dip = 40;
    const widths = ids.map((id) => estimateBoxWidth(nodes[id].short));
    const positions = {};
    let x = margin;
    ids.forEach((id, i) => {
      positions[id] = { x, y: margin, w: widths[i], h: boxH };
      x += widths[i] + gapX;
    });
    const svgW = x - gapX + margin;
    const svgH = margin * 2 + boxH + dip;

    const svg = svgEl("svg", { viewBox: `0 0 ${svgW} ${svgH}`, role: "img", "aria-label": "Relations inférées entre les tables de ce système." });
    const defs = svgEl("defs", {});
    const marker = svgEl("marker", { id: "er-arrow-" + ids[0], viewBox: "0 0 10 10", refX: "8", refY: "5", markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse" });
    marker.appendChild(svgEl("path", { d: "M0,0 L10,5 L0,10 z", style: "fill: currentColor" }));
    defs.appendChild(marker);
    svg.appendChild(defs);

    let hasEdges = false;
    ids.forEach((id) => {
      (nodes[id].fkGuesses || []).forEach((g) => {
        const a = positions[id], b = positions[g.refNode];
        if (!a || !b) return;
        hasEdges = true;
        const x1 = a.x + a.w / 2, y1 = a.y + a.h;
        const x2 = b.x + b.w / 2, y2 = b.y + b.h;
        const midX = (x1 + x2) / 2;
        const path = svgEl("path", {
          d: `M ${x1} ${y1} Q ${midX} ${y1 + dip} ${x2} ${y2}`,
          style: "fill: none; stroke: var(--text-muted); color: var(--text-muted); stroke-width: 1.2px;",
          "marker-end": "url(#er-arrow-" + ids[0] + ")",
        });
        svg.appendChild(path);
      });
    });

    ids.forEach((id) => {
      const pos = positions[id];
      const type = nodes[id].type;
      const g = svgEl("g", { class: "lineage-node is-clickable", tabindex: "0", role: "button", "aria-label": nodes[id].name });
      const rect = svgEl("rect", {
        x: pos.x, y: pos.y, width: pos.w, height: pos.h, rx: 7, class: "lineage-rect",
        style: `fill: var(--${type}-soft); stroke: var(--${type}); stroke-width: 1.2px;`,
      });
      const text = svgEl("text", {
        x: pos.x + pos.w / 2, y: pos.y + pos.h / 2 + 4, "text-anchor": "middle",
        style: `font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: var(--${type});`,
      });
      text.textContent = nodes[id].short;
      g.append(rect, text);
      const go = () => { switchView("fiche"); history = [id]; render(); };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      svg.appendChild(g);
    });

    return { svg, hasEdges };
  }

  function renderSystemsView() {
    const container = document.getElementById("systems-container");
    container.innerHTML = "";
    const groups = groupBySystem();
    const systemNames = Object.keys(groups).sort();

    if (!systemNames.length) {
      const p = document.createElement("p");
      p.className = "derive-empty";
      p.textContent = "Aucun système source dans ce jeu de données.";
      container.appendChild(p);
      return;
    }

    for (const sys of systemNames) {
      const ids = groups[sys];
      const card = document.createElement("div");
      card.className = "system-card";

      const title = document.createElement("h3");
      title.className = "system-title";
      title.textContent = sys;
      card.appendChild(title);

      const totalRows = ids.reduce((sum, id) => sum + (typeof nodes[id].rowCount === "number" ? nodes[id].rowCount : 0), 0);
      const impacted = systemImpactCount(ids);
      const metaParts = [ids.length + " table(s)"];
      if (totalRows) metaParts.push(totalRows.toLocaleString("fr-FR") + " lignes au total");
      metaParts.push(impacted + " élément(s) impacté(s) en aval");
      const meta = document.createElement("p");
      meta.className = "system-meta";
      meta.textContent = metaParts.join("  ·  ");
      card.appendChild(meta);

      const chips = document.createElement("div");
      chips.className = "system-tables";
      ids.forEach((id) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        const dot = document.createElement("span");
        dot.className = "chip-dot type-" + nodes[id].type;
        const rc = typeof nodes[id].rowCount === "number" ? " (" + nodes[id].rowCount.toLocaleString("fr-FR") + ")" : "";
        chip.append(dot, document.createTextNode(nodes[id].name + rc));
        chip.addEventListener("click", () => { switchView("fiche"); history = [id]; render(); });
        chips.appendChild(chip);
      });
      card.appendChild(chips);

      if (ids.length > 1) {
        const { svg, hasEdges } = erDiagram(ids);
        if (hasEdges) {
          const figure = document.createElement("figure");
          figure.className = "lineage-figure";
          figure.appendChild(svg);
          const cap = document.createElement("figcaption");
          cap.textContent = "Relations inférées par convention de nommage (non contraintes en base).";
          figure.appendChild(cap);
          card.appendChild(figure);

          const list = document.createElement("ul");
          list.className = "derive-list";
          ids.forEach((id) => {
            (nodes[id].fkGuesses || []).forEach((g) => {
              const li = document.createElement("li");
              li.className = "derive-row";
              const mark = document.createElement("span");
              mark.className = "derive-mark change";
              mark.textContent = "→";
              li.append(mark, codeText(nodes[id].short + "." + g.column + " → " + nodes[g.refNode].short + "." + g.refColumn));
              list.appendChild(li);
            });
          });
          card.appendChild(list);
        }
      }

      container.appendChild(card);
    }
  }

  function render() {
    const id = history[history.length - 1];
    const inspector = document.getElementById("inspector");

    if (!id || !canSeeNode(id)) {
      document.getElementById("breadcrumb").innerHTML = "";
      for (const btnId in sidebarButtons) sidebarButtons[btnId].classList.remove("active");
      inspector.innerHTML = "";
      const p = document.createElement("p");
      p.className = "role-empty";
      p.textContent = "Aucun élément accessible avec le rôle " + ROLES[currentRole].label + " sur ce jeu de données. " +
        (currentRole === "pdg" ? "Ce projet ne modélise encore aucun indicateur business (type \"metric\") — seulement des tables techniques." :
         currentRole === "rh" ? "Aucun élément n'est marqué \"Donnée personnelle (RGPD)\" ici." : "");
      inspector.appendChild(p);
      return;
    }

    const node = nodes[id];
    renderBreadcrumb();

    for (const btnId in sidebarButtons) sidebarButtons[btnId].classList.toggle("active", btnId === id);
    const activeBtn = sidebarButtons[id];
    if (activeBtn) activeBtn.scrollIntoView({ block: "nearest", inline: "nearest" });

    inspector.innerHTML = "";
    const root = document.createElement("div");
    root.className = "inspector-content";
    inspector.appendChild(root);

    // En-tête
    const head = document.createElement("div");
    head.className = "node-head";
    const badgeRow = document.createElement("div");
    badgeRow.className = "badge-row";
    const typeBadge = document.createElement("span");
    typeBadge.className = "badge type-" + node.type;
    typeBadge.textContent = TYPE_LABEL[node.type];
    const domainBadge = document.createElement("span");
    domainBadge.className = "badge domain";
    domainBadge.textContent = node.domain;
    badgeRow.append(typeBadge, domainBadge);
    for (const tag of node.tags || []) {
      const t = document.createElement("span");
      t.className = "tag-pill";
      t.textContent = tag;
      badgeRow.appendChild(t);
    }
    const name = document.createElement("h2");
    name.className = "node-name";
    name.textContent = node.name;
    const desc = document.createElement("p");
    desc.className = "node-desc";
    desc.textContent = node.description;
    head.append(badgeRow, name, desc);
    root.appendChild(head);

    // Position dans le lignage (diagramme local : ce dont dépend le nœud, en haut ;
    // ce qui le référence, en bas). Absent quand le nœud n'a ni l'un ni l'autre.
    const diagram = lineageDiagram(id);
    if (diagram) root.appendChild(diagram);

    // Ligne de faits clés (chaque champ est optionnel selon le jeu de données)
    const facts = [];
    if (node.owner) facts.push(node.owner);
    if (node.source) facts.push(node.source.system + " · " + node.source.table + (node.source.column ? "." + node.source.column : ""));
    if (node.data_type) facts.push(node.data_type);
    if (node.materialized) facts.push("Matérialisation : " + node.materialized);
    if (node.relation) facts.push(node.relation);
    if (node.refresh) facts.push(node.refresh);
    if (node.last_updated) facts.push("MAJ " + node.last_updated);
    if (typeof node.rowCount === "number") facts.push(node.rowCount.toLocaleString("fr-FR") + " lignes");
    if (activeDatasetKey === "real") facts.push("Manifest dbt généré le " + REAL_GENERATED_AT);
    const keyfacts = document.createElement("p");
    keyfacts.className = "keyfacts";
    keyfacts.textContent = facts.join("  ·  ");
    root.appendChild(keyfacts);

    // Lien vers la fiche native du système source. Projet réel : requête de lecture
    // prête à copier (psql/pgAdmin), toujours en lecture seule. Démo : maquette
    // désactivée (système fictif, pas de vraie destination à pointer). Réservé aux
    // rôles habilités (sections.correction) — ce n'est pas un contrôle d'accès réel
    // (page statique, sans backend), juste une simulation de ce à quoi ça ressemblerait.
    if (ROLES[currentRole].sections.correction) {
      if (activeDatasetKey === "real" && node.queryHint) {
        root.appendChild(queryHintWidget(node.queryHint, node.source ? node.source.system : node.relation));
        if (node.updateTemplate) root.appendChild(updateTemplateWidget(node.updateTemplate));
      } else if (node.source) {
        const link = document.createElement("button");
        link.className = "ext-link";
        link.type = "button";
        link.disabled = true;
        link.title = "Démo : pointerait vers la fiche d'édition native dans " + node.source.system;
        link.textContent = "↗ Ouvrir dans " + node.source.system;
        root.appendChild(link);
      }
      if (activeDatasetKey === "real" && node.filePath) {
        root.appendChild(issueLinkWidget(node));
      }
    }

    // Qualité des données (métrique/calcul démo) — pour le projet réel, les tests
    // apparaissent au niveau de chaque colonne, dans la section Colonnes ci-dessous.
    if (node.quality && node.quality.length) {
      const qRow = document.createElement("div");
      qRow.className = "quality-row";
      for (const check of node.quality) {
        const pill = document.createElement("span");
        pill.className = "quality-pill";
        const dot = document.createElement("span");
        dot.className = "quality-dot status-" + check.status;
        pill.append(dot, document.createTextNode(check.note ? check.label + " — " + check.note : check.label));
        qRow.appendChild(pill);
      }
      root.appendChild(qRow);
    }

    // Formule
    if (node.formula && ROLES[currentRole].sections.formula) {
      const bar = document.createElement("div");
      bar.className = "formula-bar";
      bar.appendChild(formulaFragment(node.formula));
      root.appendChild(section("Formule", bar));
    }

    // Colonnes (projet réel : structure de la table telle qu'introspectée)
    if (node.columns && node.columns.length && ROLES[currentRole].sections.columns) {
      root.appendChild(section("Colonnes", columnsSection(node.columns)));
    }

    // Détails techniques (repliés) : SQL + valeurs observées
    if ((node.sql || node.example) && ROLES[currentRole].sections.sql) {
      const details = document.createElement("details");
      details.className = "tech-details";
      const summary = document.createElement("summary");
      summary.textContent = "Détails techniques";
      const body = document.createElement("div");
      body.className = "tech-body";
      if (node.sql) {
        const bar = document.createElement("div");
        bar.className = "sql-block";
        bar.appendChild(node.sqlKind === "jinja" ? realSqlFragment(node.sql, id) : sqlFragment(node.sql, id));
        body.appendChild(section("Définition SQL", bar));
      }
      if (node.example) {
        const row = document.createElement("div");
        row.className = "example-row";
        for (const v of node.example) {
          const pill = document.createElement("span");
          pill.className = "example-pill";
          pill.textContent = v;
          row.appendChild(pill);
        }
        body.appendChild(section("Valeurs observées", row));
      }
      details.append(summary, body);
      root.appendChild(details);
    }

    // Dépend de / Référencé par
    const relGrid = document.createElement("div");
    relGrid.className = "rel-grid";

    if (node.deps.length || !node.source) {
      const col = document.createElement("div");
      col.className = "rel-col";
      const eyebrow = document.createElement("p");
      eyebrow.className = "eyebrow";
      eyebrow.textContent = "Dépend de";
      col.append(eyebrow, chipList(node.deps, "Aucune dépendance."));
      relGrid.appendChild(col);
    }

    const parents = usedBy(id);
    const col2 = document.createElement("div");
    col2.className = "rel-col";
    const eyebrow2 = document.createElement("p");
    eyebrow2.className = "eyebrow";
    eyebrow2.textContent = "Référencé par";
    col2.append(eyebrow2, chipList(parents, "N'entre dans le calcul d'aucun autre indicateur listé ici."));
    relGrid.appendChild(col2);

    root.appendChild(relGrid);
  }

  render();
</script>
